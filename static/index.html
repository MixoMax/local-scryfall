<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyScryfall // TERMINAL</title>
    
    <!-- External Libs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#00f3ff',
                        surface: '#0a0a0a',
                        glass: 'rgba(255, 255, 255, 0.03)'
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/cyberpunk.css">
</head>
<body class="bg-[#050505] text-gray-300 min-h-screen selection:bg-accent selection:text-black overflow-x-hidden">

    <!-- Header -->
    <header class="fixed w-full top-0 z-50 glass-panel border-b border-white/5 backdrop-blur-md">
        <div class="container mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- Logo -->
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-bold tracking-tighter uppercase text-white">
                    <a href="/">MyScryfall</a> <span class="text-accent text-xs align-top font-mono">v2.0</span>
                </h1>
            </div>

            <!-- Search -->
            <div class="flex-grow max-w-2xl w-full">
                <form id="searchForm" class="relative group">
                    <input type="text" id="search" name="q" 
                           class="w-full bg-black/50 border border-white/10 p-3 pl-4 text-sm font-mono text-accent focus:border-accent focus:outline-none transition-colors uppercase placeholder-gray-700"
                           placeholder="SEARCH_DATABASE :: o:vigilance t:creature">
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 w-2 h-2 bg-accent rounded-full opacity-50 group-hover:opacity-100 transition-opacity"></div>
                </form>
            </div>

            <!-- Nav -->
            <nav class="flex gap-6 text-xs font-mono uppercase tracking-widest">
                <a href="/random" class="nav-link hover:text-accent transition-colors">Random_Card</a>
                <a href="/random-edh.html" class="nav-link hover:text-accent transition-colors">EDH_Gen</a>
                <a href="/draft" class="nav-link hover:text-accent transition-colors">Draft_Sim</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 pt-32 pb-20 relative z-10 min-h-screen">
        
        <!-- Stats Section -->
        <div id="query-stats" class="font-mono text-xs text-accent mb-4 hidden pl-1 border-l-2 border-accent"></div>
        
        <div class="stats-controls mb-6 hidden">
            <button id="toggleStatsBtn" class="font-mono text-xs uppercase border border-accent/30 px-4 py-2 hover:bg-accent hover:text-black transition-colors">
                Initialize_Statistics
            </button>
        </div>

        <div id="statsContainer" class="terminal-box p-6 rounded-sm mb-12 hidden">
            <div class="border-b border-gray-800 pb-4 mb-6">
                <h3 class="text-accent font-mono text-sm mb-4">> DATA_VISUALIZATION_MODULE</h3>
                <div id="chartOptions" class="flex flex-wrap gap-6 font-mono text-xs text-gray-500">
                    <!-- Checkboxes injected here -->
                </div>
            </div>
            <div id="chartGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Charts injected here -->
            </div>
        </div>

        <!-- Results Grid -->
        <div id="results" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- Cards injected here -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="fixed bottom-0 w-full py-2 px-6 text-[10px] font-mono text-gray-700 uppercase flex justify-between pointer-events-none z-40 bg-black/80 backdrop-blur-sm border-t border-white/5">
        <span>Sys.Status: ONLINE</span>
        <span>Loc: /home/linush</span>
    </footer>

    <!-- Scripts -->
    <script src="/cyberpunk.js"></script>
    
    <script>
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('search');
        const resultsDiv = document.getElementById('results');
        const statsControls = document.querySelector('.stats-controls');
        const toggleStatsBtn = document.getElementById('toggleStatsBtn');
        const statsContainer = document.getElementById('statsContainer');
        const chartOptionsDiv = document.getElementById('chartOptions');
        const chartGridDiv = document.getElementById('chartGrid');
        const queryStatsDiv = document.getElementById('query-stats');

        // --- Infinite Scroll State ---
        let allCards = [];
        let renderedCardCount = 0;
        let scrollObserver = null;
        let imageObserver = null;
        const CARDS_PER_BATCH = 100;

        let charts = {}; // To hold chart instances
        const allChartTypes = {
            cmc: { label: 'CMC', type: 'bar' },
            power: { label: 'Power', type: 'bar' },
            toughness: { label: 'Toughness', type: 'bar' },
            loyalty: { label: 'Loyalty', type: 'bar' },
            colors: { label: 'Colors', type: 'pie' },
            color_identity: { label: 'Color Identity', type: 'pie' }
        };

        // --- Chart.js Global Configuration ---
        Chart.defaults.color = '#e0e0e0';
        Chart.defaults.borderColor = '#333';
        Chart.defaults.font.family = '"JetBrains Mono", monospace';
        Chart.defaults.plugins.legend.position = 'top';
        Chart.defaults.plugins.tooltip.backgroundColor = '#0a0a0a';
        Chart.defaults.plugins.tooltip.titleColor = '#00f3ff';
        Chart.defaults.plugins.tooltip.bodyColor = '#e0e0e0';
        Chart.defaults.plugins.tooltip.borderColor = '#333';
        Chart.defaults.plugins.tooltip.borderWidth = 1;

        // Function to get query parameter from URL
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function searchCards(event) {
            if (event) {
                event.preventDefault();
            }

            const query = searchInput.value.trim();
            resultsDiv.innerHTML = '';
            if (queryStatsDiv) {
                queryStatsDiv.style.display = 'none';
            }

            // Reset infinite scroll state
            if (scrollObserver) {
                scrollObserver.disconnect();
                scrollObserver = null;
            }
            if (imageObserver) {
                imageObserver.disconnect();
                imageObserver = null;
            }
            allCards = [];
            renderedCardCount = 0;

            if (!query) {
                return;
            }

            // Update URL with the search query
            const newUrl = `${window.location.pathname}?q=${encodeURIComponent(query)}`;
            history.pushState({ query }, '', newUrl);

            const url = `/api/v1/search?q=${encodeURIComponent(query)}`;

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // First, clear old stats and hide container
                    clearStats();

                    if (data.cards && data.cards.length > 0) {
                        if (data.took_ms !== undefined) {
                            queryStatsDiv.textContent = `> ${data.cards.length} ENTITIES RETRIEVED IN ${data.took_ms}ms`;
                            queryStatsDiv.style.display = 'block';
                        }

                        // Show stats button and generate charts
                        statsControls.style.display = 'block';
                        // Only generate stats if the container is already visible
                        if (statsContainer.style.display !== 'none') {
                            generateStats(data.cards);
                        }

                        // Create and observe intersection observer for lazy loading
                        const imageObserver = new IntersectionObserver((entries, observer) => {
                            entries.forEach(entry => {
                                if (entry.isIntersecting) {
                                    const img = entry.target;
                                    img.src = img.dataset.src;
                                    observer.unobserve(img);
                                }
                            });
                        });

                        data.cards.forEach((card, index) => {
                            const cardItem = document.createElement('div');
                            // Cyberpunk styling for card container
                            cardItem.className = 'card-item glass-panel p-3 rounded border border-white/5 hover:border-accent/50 transition-colors group relative';

                            const cardLink = document.createElement('a');
                            cardLink.href = `/card/${encodeURIComponent(card.safe_name)}`;
                            cardLink.className = 'block';

                            const imgWrapper = document.createElement('div');
                            imgWrapper.className = 'img-cyberpunk-wrapper overflow-hidden rounded relative';

                            const cardImg = document.createElement('img');
                            cardImg.alt = card.name;
                            cardImg.title = card.name;
                            cardImg.className = 'img-cyberpunk w-full h-auto';
                            
                            // First 8 cards load immediately, rest are lazy loaded
                            if (index < 8) {
                                cardImg.src = `/${card.file_name}`;
                            } else {
                                cardImg.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"; // Transparent placeholder
                                cardImg.dataset.src = `/${card.file_name}`;
                                imageObserver.observe(cardImg);
                            }

                            imgWrapper.appendChild(cardImg);
                            cardLink.appendChild(imgWrapper);
                            cardItem.appendChild(cardLink);
                            resultsDiv.appendChild(cardItem);
                        });
                        
                        // Re-init hover effects for new elements
                        if (window.initCursor) {
                            // This might be handled by the MutationObserver in cyberpunk.js, 
                            // but explicit call doesn't hurt if exposed.
                        }

                    } else {
                        resultsDiv.innerHTML = '<p class="no-results font-mono text-gray-500 col-span-full text-center py-12">NO_DATA_FOUND</p>';
                    }
                })
                .catch(error => {
                    console.error('Error fetching cards:', error);
                    resultsDiv.innerHTML = '<p class="error-message font-mono text-red-500 col-span-full text-center py-12">SYSTEM_ERROR: FETCH_FAILED</p>';
                    clearStats();
                });
        }

        function clearStats(fullClear = true) {
            // Destroy all previous chart instances
            Object.values(charts).forEach(chart => chart.destroy());
            charts = {};
            chartGridDiv.innerHTML = ''; // Clear the grid

            if (fullClear) {
                statsControls.style.display = 'none';
                statsContainer.style.display = 'none';
                toggleStatsBtn.textContent = 'Initialize_Statistics';
            }
        }

        function getChartPreferences() {
            const savedPrefs = localStorage.getItem('chartPreferences');
            if (savedPrefs) {
                return JSON.parse(savedPrefs);
            }
            // Default preferences
            return {
                cmc: true,
                power: false,
                toughness: false,
                loyalty: false,
                colors: true,
                color_identity: true
            };
        }

        function saveChartPreferences(prefs) {
            localStorage.setItem('chartPreferences', JSON.stringify(prefs));
        }


        function generateStats(cards) {
            clearStats(false); // Clear previous charts without hiding the container
            const preferences = getChartPreferences();

            const cardData = {
                cmc: cards.map(c => c.cmc),
                power: cards.map(c => c.power).filter(p => p !== null),
                toughness: cards.map(c => c.toughness).filter(t => t !== null),
                loyalty: cards.map(c => c.loyalty).filter(l => l !== null),
                colors: cards.flatMap(c => c.colors || ['C']),
                color_identity: cards.flatMap(c => c.color_identity || ['C'])
            };

            for (const [key, config] of Object.entries(allChartTypes)) {
                if (preferences[key] && cardData[key].length > 0) {
                    const canvasId = `${key}Chart`;
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'chart-wrapper bg-black/40 p-4 rounded border border-white/5';
                    if (config.type === 'pie') {
                        wrapper.classList.add('pie-chart-wrapper');
                    }

                    const canvas = document.createElement('canvas');
                    canvas.id = canvasId;
                    wrapper.appendChild(canvas);
                    chartGridDiv.appendChild(wrapper);

                    const chartTitle = `${config.label} Distribution`;
                    const dataPayload = { label: config.label, data: cardData[key] };

                    if (config.type === 'bar') {
                        charts[canvasId] = createBarChart(canvasId, chartTitle, dataPayload);
                    } else if (config.type === 'pie') {
                        charts[canvasId] = createPieChart(canvasId, chartTitle, dataPayload);
                    }
                }
            }
        }

        function createBarChart(canvasId, title, data) {
            const counts = data.data.reduce((acc, val) => {
                acc[val] = (acc[val] || 0) + 1;
                return acc;
            }, {});

            const sortedKeys = Object.keys(counts).sort((a, b) => {
                // Handle 'X' and other non-numeric values
                const numA = isNaN(a) ? -1 : parseFloat(a);
                const numB = isNaN(b) ? -1 : parseFloat(b);
                return numA - numB;
            });

            const chartData = {
                labels: sortedKeys,
                datasets: [{
                    label: data.label,
                    data: sortedKeys.map(key => counts[key]),
                    backgroundColor: 'rgba(0, 243, 255, 0.2)',
                    borderColor: '#00f3ff',
                    borderWidth: 1
                }]
            };

            const ctx = document.getElementById(canvasId).getContext('2d');
            return new Chart(ctx, {
                type: 'bar',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: title.toUpperCase(), color: '#9ca3af', font: { family: 'Space Grotesk' } },
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#333' }, ticks: { color: '#9ca3af', font: { family: 'JetBrains Mono' } } },
                        x: { grid: { color: '#333' }, ticks: { color: '#9ca3af', font: { family: 'JetBrains Mono' } } }
                    }
                }
            });
        }

        function createPieChart(canvasId, title, data) {
            const colorMap = { 'W': '#F8F6D8', 'U': '#C1D7E9', 'B': '#ABA29F', 'R': '#E8B3A4', 'G': '#BDE3C0', 'C': '#CCCCCC' };
            const counts = data.data.reduce((acc, val) => {
                acc[val] = (acc[val] || 0) + 1;
                return acc;
            }, {});

            const chartData = {
                labels: Object.keys(counts),
                datasets: [{
                    label: data.label,
                    data: Object.values(counts),
                    backgroundColor: Object.keys(counts).map(c => colorMap[c] || '#808080'),
                    borderColor: '#0a0a0a',
                    borderWidth: 2,
                    hoverOffset: 4
                }]
            };

            const ctx = document.getElementById(canvasId).getContext('2d');
            return new Chart(ctx, {
                type: 'pie',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: title.toUpperCase(), color: '#9ca3af', font: { family: 'Space Grotesk' } },
                        legend: { labels: { color: '#9ca3af', font: { family: 'JetBrains Mono' } } }
                    }
                }
            });
        }

        toggleStatsBtn.addEventListener('click', () => {
            const isHidden = statsContainer.style.display === 'none';
            statsContainer.style.display = isHidden ? 'block' : 'none';
            toggleStatsBtn.textContent = isHidden ? 'Terminate_Statistics' : 'Initialize_Statistics';

            // If we are showing the stats, and there are results, generate the charts
            if (isHidden && resultsDiv.querySelector('.card-item')) {
                const query = getQueryParam('q');
                if (query) {
                    fetch(`/api/v1/search?q=${encodeURIComponent(query)}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.cards && data.cards.length > 0) {
                                generateStats(data.cards);
                            }
                        });
                }
            }
        });

        function setupChartOptions() {
            const preferences = getChartPreferences();
            chartOptionsDiv.innerHTML = '<span class="text-accent mr-4">METRICS:</span>';

            for (const [key, config] of Object.entries(allChartTypes)) {
                const label = document.createElement('label');
                label.className = 'flex items-center gap-2 cursor-pointer hover:text-white transition-colors';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `check-${key}`;
                checkbox.checked = preferences[key] || false;
                checkbox.className = 'accent-cyan-500 bg-gray-800 border-gray-600 rounded focus:ring-cyan-500 focus:ring-2';

                checkbox.addEventListener('change', () => {
                    const currentPrefs = getChartPreferences();
                    currentPrefs[key] = checkbox.checked;
                    saveChartPreferences(currentPrefs);

                    // If stats are visible, regenerate them
                    if (statsContainer.style.display !== 'none' && resultsDiv.querySelector('.card-item')) {
                         const query = getQueryParam('q');
                        if (query) {
                             fetch(`/api/v1/search?q=${encodeURIComponent(query)}`)
                                .then(res => res.json())
                                .then(data => {
                                    if (data.cards && data.cards.length > 0) {
                                        generateStats(data.cards);
                                    }
                                });
                        }
                    }
                });

                label.appendChild(checkbox);
                label.append(` ${config.label}`);
                chartOptionsDiv.appendChild(label);
            }
        }


        searchForm.addEventListener('submit', searchCards);

        // Check for query parameter on page load
        window.addEventListener('load', () => {
            setupChartOptions();
            const query = getQueryParam('q');
            if (query) {
                searchInput.value = query;
                searchCards();
            }
        });

    </script>
</body>
</html>
