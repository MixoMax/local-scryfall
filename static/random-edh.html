<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDH Constructor // TERMINAL</title>
    
    <!-- External Libs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#00f3ff',
                        surface: '#0a0a0a',
                        glass: 'rgba(255, 255, 255, 0.03)'
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/cyberpunk.css">
    <style>
        .selected-commander { border-color: #00f3ff !important; box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); }
        .card-selected { border-color: #00f3ff !important; opacity: 1 !important; }
        .card-unselected { border-color: transparent; opacity: 0.6; }
    </style>
</head>
<body class="bg-[#050505] text-gray-300 min-h-screen selection:bg-accent selection:text-black overflow-x-hidden">

    <!-- Header -->
    <header class="fixed w-full top-0 z-50 glass-panel border-b border-white/5 backdrop-blur-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tighter uppercase text-white">
                <a href="/">MyScryfall</a> <span class="text-accent text-xs align-top font-mono">v2.0</span>
            </h1>
             <nav class="flex gap-6 text-xs font-mono uppercase tracking-widest">
                <a href="/" class="nav-link hover:text-accent transition-colors">Return_Home</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-6 pt-32 pb-20 relative z-10 min-h-screen">
        
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-white font-sans uppercase tracking-tight mb-2">EDH Deck Constructor</h1>
            <p class="font-mono text-accent text-sm">PROTOCOL: RANDOMIZED_COMMANDER_INIT</p>
        </div>

        <div id="loading" class="hidden text-center font-mono text-accent animate-pulse mb-8">
            > ACCESSING_DATABASE...
        </div>
        <div id="error" class="text-center font-mono text-red-500 mb-8"></div>

        <!-- Step 1 -->
        <section class="mb-20">
            <div class="flex items-center gap-4 mb-8 border-b border-white/10 pb-4">
                <span class="bg-accent text-black font-bold font-mono px-2 py-1 text-xs">STEP_01</span>
                <h2 class="text-xl font-bold text-white font-sans uppercase tracking-tight">Select Commander Unit</h2>
            </div>
            
            <div id="commander-selection" class="grid grid-cols-2 md:grid-cols-5 gap-6 justify-center">
                <!-- Commander images will be loaded here -->
            </div>
        </section>

        <!-- Step 2 -->
        <section class="mb-12">
            <div class="flex items-center justify-between gap-4 mb-8 border-b border-white/10 pb-4">
                <div class="flex items-center gap-4">
                    <span class="bg-gray-800 text-white font-bold font-mono px-2 py-1 text-xs">STEP_02</span>
                    <h2 class="text-xl font-bold text-white font-sans uppercase tracking-tight">Deck Compilation</h2>
                </div>
                <p class="font-mono text-xs text-gray-400">SELECTED: <span id="selected-count" class="text-accent font-bold text-lg">0</span>/30</p>
            </div>

            <div id="deck-display" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <!-- Deck card images will be loaded here -->
            </div>
        </section>

        <div class="fixed bottom-8 right-8 z-50">
            <button onclick="copyDecklist()" class="glass-panel bg-black/80 text-accent border border-accent hover:bg-accent hover:text-black font-mono uppercase text-sm px-6 py-4 transition-all font-bold tracking-wider shadow-[0_0_20px_rgba(0,243,255,0.1)]">
                Export_Decklist
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="fixed bottom-0 w-full py-2 px-6 text-[10px] font-mono text-gray-700 uppercase flex justify-between pointer-events-none z-40 bg-black/80 backdrop-blur-sm border-t border-white/5">
        <span>Sys.Status: ONLINE</span>
        <span>Loc: /edh_builder</span>
    </footer>

    <script src="/cyberpunk.js"></script>
    <script>
        const loadingDiv = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const commanderSelectionDiv = document.getElementById('commander-selection');
        const deckDisplayDiv = document.getElementById('deck-display');

        let selectedCommander = null;
        
        let n_selected_cards = 0;

        function updateSelectedCount() {
            const selectedCards = deckDisplayDiv.querySelectorAll('.card-image[selected="true"]');
            n_selected_cards = selectedCards.length;
            document.getElementById('selected-count').textContent = n_selected_cards;
        }

        async function fetchJson(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ detail: `HTTP error! status: ${response.status}` }));
                    throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (e) {
                console.error("Fetch error:", e);
                errorDiv.textContent = `SYSTEM_ERROR: ${e.message}`;
                throw e;
            }
        }

        function displayCards(cards, container, isCommanderSelection) {
            container.innerHTML = ''; // Clear previous cards
            if (!cards || cards.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center font-mono text-gray-500">NO_DATA_FOUND</p>';
                return;
            }
            cards.forEach((card, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-item glass-panel p-2 rounded border border-white/5 hover:border-accent/50 transition-all cursor-pointer group relative';
                
                const imgWrapper = document.createElement('div');
                imgWrapper.className = 'img-cyberpunk-wrapper rounded overflow-hidden relative';

                const img = document.createElement('img');
                img.src = "/" + card.file_name
                img.alt = card.name;
                img.title = card.name;
                img.className = 'img-cyberpunk w-full h-auto card-image';
                
                imgWrapper.appendChild(img);
                wrapper.appendChild(imgWrapper);
                container.appendChild(wrapper);

                // Animation
                if (window.gsap) {
                    gsap.fromTo(wrapper, 
                        { y: 20, opacity: 0 },
                        { y: 0, opacity: 1, duration: 0.5, delay: index * 0.05 }
                    );
                }

                if (isCommanderSelection) {
                    wrapper.addEventListener('click', () => handleCommanderSelection(card, wrapper));
                } else {
                    img.setAttribute('selected', 'false');
                    wrapper.classList.add('card-unselected'); // Default state

                    wrapper.addEventListener('click', () => {
                        // Toggle selection logic
                        const isSelected = img.getAttribute('selected') === 'true';
                        
                        if (!isSelected && n_selected_cards >= 30) {
                            return; // Max limit reached
                        }

                        if (isSelected) {
                            img.setAttribute('selected', 'false');
                            wrapper.classList.remove('card-selected');
                            wrapper.classList.add('card-unselected');
                        } else {
                            img.setAttribute('selected', 'true');
                            wrapper.classList.add('card-selected');
                            wrapper.classList.remove('card-unselected');
                        }
                        updateSelectedCount();
                    });
                }
            });
        }

        async function handleCommanderSelection(commander, wrapperElement) {
            if (selectedCommander) {
                return;
            }
            selectedCommander = commander;
            console.log("Commander selected:", selectedCommander);
            errorDiv.textContent = ''; 

            // Highlight selected commander
            document.querySelectorAll('#commander-selection .card-item').forEach(el => {
                el.classList.remove('selected-commander');
                el.style.opacity = '0.3'; // Dim others
            });
            wrapperElement.classList.add('selected-commander');
            wrapperElement.style.opacity = '1';
            
            deckDisplayDiv.innerHTML = ''; 
            loadingDiv.style.display = 'block';
            loadingDiv.textContent = '> COMPILING_DECK_MATRIX...';

            const colorIdentity = commander.color_identity;
            let deckQuery = '';

            if (!colorIdentity || colorIdentity.length === 0) {
                deckQuery = 'ci:C';
            } else {
                deckQuery = "ci:" + colorIdentity.join("");
            }
            
            try {
                const data = await fetchJson(`/api/v1/random?q=${encodeURIComponent("f:commander " + deckQuery + " AND -t=Land AND -t=Stickers AND -t:Attraction")}&count=100`);
                displayCards(data.cards, deckDisplayDiv, false);
            } catch (e) {
                // Error already handled by fetchJson
            }
            loadingDiv.style.display = 'none';
        }

        async function initializePage() {
            loadingDiv.textContent = '> INITIALIZING_COMMANDER_LIST...';
            loadingDiv.style.display = 'block';
            errorDiv.textContent = '';
            commanderSelectionDiv.innerHTML = '';
            deckDisplayDiv.innerHTML = '';

            try {
                const data = await fetchJson('/api/v1/random?q=' + encodeURIComponent('f:commander t:creature t:legendary') + '&count=5');
                if (data.cards && data.cards.length > 0) {
                    displayCards(data.cards, commanderSelectionDiv, true);
                } else if (data.card) { 
                    displayCards([data.card], commanderSelectionDiv, true);
                }
                else {
                    errorDiv.textContent = 'NO_COMMANDERS_FOUND';
                }
            } catch (e) {
                // Error already handled by fetchJson
            }
            loadingDiv.style.display = 'none';
        }

        function copyDecklist() {
            if (!selectedCommander) {
                alert("ERROR: COMMANDER_NOT_SELECTED");
                return;
            }

            let deckList = Array.from(deckDisplayDiv.querySelectorAll('.card-image[selected="true"]'))
                .map(img => "1 " + img.alt)
                .join('\n');

            navigator.clipboard.writeText(deckList)
                .then(() => {
                    alert("SUCCESS: DECKLIST_COPIED_TO_CLIPBOARD");
                })
                .catch(err => {
                    console.error('Failed to copy decklist:', err);
                    alert("ERROR: COPY_FAILED");
                });
        }
        // Initialize the page on load
        initializePage();
    </script>
</body>
</html>
